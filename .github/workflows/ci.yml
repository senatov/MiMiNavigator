name: CI — MiMiNavigator

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-quality:
    name: Build & Quality (macOS 27 / Xcode 27)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          xcodebuild -version | grep -q '^Xcode 27'

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build (Debug)
        shell: zsh {0}
        run: |
          set -e -o pipefail
          xcodebuild clean build \
            -project MiMiNavigator.xcodeproj \
            -scheme MiMiNavigator \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | xcbeautify --renderer github-actions

      - name: Run tests
        # Keep a bounded test duration on the hosted runner.
        timeout-minutes: 15
        continue-on-error: true
        shell: zsh {0}
        run: |
          set -e -o pipefail
          xcodebuild test \
            -project MiMiNavigator.xcodeproj \
            -scheme MiMiNavigator \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions

      - name: SwiftLint
        continue-on-error: true
        run: |
          if ! command -v swiftlint &>/dev/null; then
            brew install swiftlint
          fi
          swiftlint lint --strict

      - name: Swift-format lint
        continue-on-error: true
        run: xcrun swift-format lint --recursive GUI/Sources

      - name: Summary
        if: always()
        run: |
          echo "### ✅ CI finished" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macOS 27" >> $GITHUB_STEP_SUMMARY
          echo "- Xcode: $(xcodebuild -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
